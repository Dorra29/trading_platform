{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login | TradeTuniZ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;400&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #3b0764 0%, #18181b 100%); min-height: 100vh;}
    .glass { background: rgba(40,40,60,0.7); box-shadow: 0 8px 32px 0 rgba(31,38,135,.37); backdrop-filter: blur(8px); border-radius: 16px; border: 1px solid rgba(255,255,255,0.18);}
    .shimmer { position: relative; overflow: hidden;}
    .shimmer::after {content: ''; position: absolute; top: 0; left: -75%; width: 50%; height: 100%; background: linear-gradient(120deg,rgba(255,255,255,0) 0%,rgba(255,255,255,0.6) 50%,rgba(255,255,255,0) 100%); animation: shimmer 2s infinite;}
    @keyframes shimmer {100% { left: 125%; } }
    .vibe-animate:hover { animation: wiggle 0.4s;}
    @keyframes wiggle {0% { transform: rotate(-2deg) scale(1.02);} 50% { transform: rotate(2deg) scale(1.06);} 100% { transform: rotate(-1deg) scale(1.02);} }
  </style>
</head>
<body class="text-white font-sans">
  <header class="p-6 bg-gradient-to-r from-purple-900 via-fuchsia-700 to-pink-500 shadow-lg">
    <h1 class="text-3xl font-extrabold flex items-center gap-3">🚀 TradeZ <span class="animate-bounce">🦅</span></h1>
    <p class="text-m text-fuchsia-200 italic">Login to your account</p>
  </header>
  <section class="p-10 flex flex-col items-center">
    <div class="glass p-8 max-w-md w-full">
      <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>
      {% if form.errors %}
        <div class="mb-4 bg-pink-700 text-white p-2 rounded-lg text-center">
          Invalid username or password. Please try again.
        </div>
      {% endif %}
      <form method="post" action="">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" class="mb-4 p-3 rounded-lg w-full text-black" required>
        <input type="password" name="password" placeholder="Password" class="mb-4 p-3 rounded-lg w-full text-black" required>
        <button type="submit" class="shimmer vibe-animate w-full py-3 bg-gradient-to-r from-pink-500 to-blue-500 rounded-xl font-bold hover:from-blue-600 hover:to-pink-500 text-white shadow-lg transition-all duration-300">
          Login 🚀
        </button>        
      </form>
      <p class="text-xs text-fuchsia-300 mt-4 text-center">
        Don't have an account?
        <a href="{% url 'signup' %}" class="underline text-blue-400">Sign up</a>
      </p>
    </div>
  </section>
  <footer class="p-6 text-center text-fuchsia-400 backdrop-blur-2xl">
    © 2025 TradeZ. Made with <span class="animate-pulse">❤️</span> in Tunisia.
  </footer>
</body>
</html>
